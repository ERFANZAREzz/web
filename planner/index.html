<style>
:root{--bg:#f6f8ff;--card:#fff;--tx:#1e2a44;--mut:#7a869f;--ln:#e3e9f5;--ac:#5b7cfa;--hd:#dbe4ff;--bad:#ef4444;--ok:#22c55e;

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070d;--card:#0e1424;--tx:#e8eefc;--mut:#8a98b8;--ln:#1f2a45;--ac:#6c8dff;--hd:#16224a;--w1:#16315f;--w2:#0f4a33;--w3:#5a1f48;--w4:#5a3a12;--w5:#2a3040;--sh:none}}
:root[data-theme="dark"]{--bg:#05070d;--card:#0e1424;--tx:#e8eefc;--mut:#8a98b8;--ln:#1f2a45;--ac:#6c8dff;--hd:#16224a;--w1:#16315f;--w2:#0f4a33;--w3:#5a1f48;--w4:#5a3a12;--w5:#2a3040;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,Vazirmatn,Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:86px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0}

header{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:1200px;margin:auto}

nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}

nav button b{display:flex;justify-content:center;font-weight:400;margin-bottom:2px}.ic{vertical-align:middle;flex:none}.fl{color:#f59e0b}.ban .ic{margin-inline-end:4px}nav button.on{color:#fff}nav button{position:relative;z-index:1}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:2px;text-align:center;font-size:11px;border-bottom:1px solid var(--ln);border-inline-start:1px solid var(--ln)}
td.nm{position:sticky;right:0;background:var(--card);text-align:right;font-size:13px;min-width:250px;padding:4px 8px;z-index:1;white-space:nowrap}
.nm span[contenteditable]{outline:0;display:inline-block;flex:1;min-width:90px;padding:2px 4px;border-radius:6px}.nm span[contenteditable]:focus{background:var(--w1)}
.cb{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--s,var(--mut));display:inline-block;cursor:pointer;vertical-align:middle;position:relative;flex:none}
.cb.on{background:var(--s,var(--ok))}.cb.on::after{content:"";position:absolute;left:50%;top:46%;width:5px;height:10px;margin:-6px 0 0 -2.5px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);animation:tick .38s var(--spr) both}
.gi{width:46px;padding:3px;text-align:center;font-size:12px}
.x{background:none;border:0;color:var(--mut);cursor:pointer;padding:0 4px}
.bar{height:9px;border-radius:5px;background:var(--ln);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac);position:relative;overflow:hidden;transition:width .9s var(--ease)}.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-110%);animation:shim 2.8s 1.2s ease-in-out infinite}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{text-align:center}.stat b{font-size:22px;display:block}
.task{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--ln);font-size:13px}.task.d span{text-decoration:line-through;color:var(--mut)}
.inc{color:var(--ok)}.exp{color:var(--bad)}
.tx{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;margin-bottom:4px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-height:74px;border-radius:8px;padding:3px;font-size:10px;overflow:hidden}
.cal .h{min-height:0;text-align:center;font-weight:800;font-size:12px;padding:6px 2px}
.cal .dn{font-weight:800;font-size:12px}.chip{background:var(--card);border-radius:4px;margin-top:2px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel{outline:2px solid var(--ac)}.today{box-shadow:inset 0 0 0 2px var(--tx)}
.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(60,80,140,.14)}
.stat b{font-family:Inter,Vazirmatn,sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.qt{font-weight:500;font-size:18px}nav button b{font-size:21px;line-height:1.3}nav button{font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes dash{from{stroke-dasharray:0 1000}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{width:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes blob{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,34px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.anim>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}.anim>:nth-child(2){animation-delay:.07s}.anim>:nth-child(3){animation-delay:.14s}.anim>:nth-child(4){animation-delay:.21s}.anim>:nth-child(5){animation-delay:.28s}.anim>:nth-child(n+6){animation-delay:.35s}
.anim .dn circle+circle{animation:dash 1.1s cubic-bezier(.2,.8,.2,1) both}
.anim .ln{stroke-dasharray:1;animation:draw 1.4s ease-out both}.anim .area{animation:fadeIn 1.6s both}
.anim .bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.fl,.fe{display:inline-block;animation:flick 1.8s ease-in-out infinite;transform-origin:50% 90%}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal}
.eb{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--hd),var(--w1));cursor:pointer;font-size:17px;line-height:34px;padding:0;flex:none;margin-inline-end:4px;transition:transform .2s}.eb:hover{transform:scale(1.18) rotate(-6deg)}
.cb{transition:background .2s}.cb.pop{animation:pop .45s}
.bgb{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.3;pointer-events:none;animation:blob 14s ease-in-out infinite}
nav button{transition:background .25s,color .25s,transform .2s}nav button:active{transform:scale(.92)}nav button.on b{animation:pop .45s}
.fadein{animation:fadeIn .6s both}
#pk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}#pk:empty{display:none}#pk .card{max-width:360px;width:100%;margin:0;animation:rise .35s both}
.eg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.eg button{font-size:22px;border:0;background:var(--bg);border-radius:10px;padding:6px 0;cursor:pointer;transition:transform .15s}.eg button:hover{transform:scale(1.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}#login:empty{display:none}#login .card{max-width:380px;width:100%;text-align:center}#login input{width:100%;margin:6px 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 12px;line-height:2.1}footer a{color:var(--ac);text-decoration:none}.qt{text-align:center;font-size:16px;line-height:2;padding:4px 8px}.qt small{display:block;color:var(--mut);font-size:12px}

:root{--spr:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes tick{from{transform:rotate(45deg) scale(0)}to{transform:rotate(45deg) scale(1)}}
@keyframes ripple{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
@keyframes shim{to{transform:translateX(110%)}}
@keyframes gshift{50%{background-position:100% 50%}}
.card{position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(108,141,255,.16),transparent 70%)}
.card:hover::before{opacity:1}
.cb.pop::before{content:"";position:absolute;inset:-2px;border-radius:7px;border:2px solid var(--s,var(--ok));pointer-events:none;animation:ripple .6s ease-out forwards}
.ttl{background-size:200% 200%;animation:gshift 9s ease-in-out infinite}
.btn{transition:transform .25s var(--spr),box-shadow .25s,filter .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(91,124,250,.3)}.btn:active{transform:scale(.94)}
#ni{position:absolute;top:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:0;width:0;background:var(--ac);border-radius:12px;transition:transform .5s var(--spr),width .5s var(--spr);box-shadow:0 6px 16px rgba(91,124,250,.4)}
.rv{opacity:0;transform:translateY(32px) scale(.98);filter:blur(6px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease)}
.rv.in{opacity:1;transform:none;filter:blur(0)}
.task,.tx{transition:transform .25s var(--ease),background .25s}.task:hover,.tx:hover{transform:translateX(-4px)}
</style>
</head>
<body>
<div class="bgb" style="width:320px;height:320px;background:var(--ac);top:-80px;inset-inline-start:-60px"></div><div class="bgb" style="width:280px;height:280px;background:#ec4899;bottom:60px;inset-inline-end:-60px;animation-delay:-6s"></div><div id="pk" onclick="if(event.target===this)this.innerHTML=''"></div>
<header><div class="grow"><h1 id="hi" style="display:flex;align-items:center;gap:6px">پک کامل پلنر</h1><div class="sub" id="today"></div></div><button class="btn ghost" id="out" title="خروج / تغییر کاربر" data-i="user"></button><button class="btn ghost" id="theme" data-i="theme"></button></header><div id="login"></div>
<main id="app"></main>
<footer>ساخته شده توسط <b>محمد عرفان زارع</b><br><b>راه ارتباطی</b><br>تلگرام: <a href="https://t.me/tvg69"><bdi>@tvg69</bdi></a></footer>
<nav><span id="ni"></span><button data-t="habit"><b class="em">🎯</b>هبیت ترکر</button><button data-t="week"><b class="em">📅</b>پلنر هفتگی</button><button data-t="budget"><b class="em">💰</b>ردیاب مالی</button><button data-t="study"><b class="em">🎓</b>پلنر تحصیلی</button>
</nav>
<script>
const fa=n=>Number(n).toLocaleString('fa-IR').replace(/٬/g,'');const fn=n=>Number(n).toLocaleString('fa-IR');
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['ش','ی','د','س','چ','پ','ج'],WF=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const LEAP=[1,5,9,13,17,22,26,30];
const P={flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.24-4.36 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',cap:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',theme:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'};
const ic=(n,s=18,c='')=>`<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
function jNow(d=new Date()){const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d);const g=t=>+p.find(x=>x.type===t).value;return{y:g('year'),m:g('month'),d:g('day')}}
const mLen=(y,m)=>m<=6?31:m<=11?30:(LEAP.includes(y%33)?30:29);
const ser=(y,m,d)=>{let s=0;for(let i=1400;i<y;i++)s+=LEAP.includes(i%33)?366:365;for(let i=1;i<m;i++)s+=mLen(y,i);return s+d};
const uk=(f,l)=>'pl:'+(f+' '+l).replace(/\s+/g,' ').trim().toLowerCase();
let SK='planner2',S=null;
const DEF=()=>({habits:[],ck:{},wt:{},notes:{},tasks:{},tx:[],bud:{},ev:{},subj:[]});
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
function load(k){let r=null;try{r=JSON.parse(localStorage.getItem(k))}catch(e){}SK=k;S=Object.assign(DEF(),r||{});migrate()}
function migrate(){if(!S.seeded){if(!S.habits.length)S.habits=[{n:'بیدار شدن ۵ صبح',e:'⏰'},{n:'خوردن ۸ لیوان آب',e:'💧'},{n:'۳۰ دقیقه ورزش',e:'💪'},{n:'۸ ساعت خواب',e:'😴'},{n:'پیاده‌روی',e:'🚶'},{n:'۱۵ دقیقه مدیتیشن',e:'🧘'},{n:'مطالعه ۵ صفحه',e:'📖'}];S.seeded=1;save()}if(!S.noemoji){S.habits.forEach(h=>{h.n=h.n.replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim()||h.n});S.noemoji=1;save()}
if(!S.emv){const M={'بیدار شدن ۵ صبح':'⏰','خوردن ۸ لیوان آب':'💧','۳۰ دقیقه ورزش':'💪','۸ ساعت خواب':'😴','پیاده‌روی':'🚶','۱۵ دقیقه مدیتیشن':'🧘','مطالعه ۵ صفحه':'📖'};S.habits.forEach(h=>{if(!h.e&&M[h.n])h.e=M[h.n]});S.emv=1;save()}}
try{if(localStorage.getItem('planner_reset')!=='r1'){Object.keys(localStorage).filter(k=>k==='planner1'||k==='planner2'||k==='planner_last'||k==='guest'||k.startsWith('pl:')).forEach(k=>localStorage.removeItem(k));localStorage.setItem('planner_reset','r1')}}catch(e){}
let last=null;try{last=localStorage.getItem('planner_last')}catch(e){}
load(last||'planner2');
if(!last&&S.user){SK=uk(S.user.f,S.user.l);save();try{localStorage.setItem('planner_last',SK)}catch(e){}}

function wtog(k,j){S.wt[k][j].d^=1;save();render()}function wdel(k,j){S.wt[k].splice(j,1);save();render()}
// ============ WEEK
function addDays(y,m,d,k){d+=k;while(d>mLen(y,m)){d-=mLen(y,m);if(++m>12){m=1;y++}}while(d<1){if(--m<1){m=12;y--}d+=mLen(y,m)}return{y,m,d}}
function vWeek(){const wd=(new Date().getDay()+1)%7,st=addDays(T.y,T.m,T.d,-wd+wkOff*7);let tot=0,dn=0,cols='',bars='';
 for(let i=0;i<7;i++){const D=addDays(st.y,st.m,st.d,i),k=`${D.y}-${D.m}-${D.d}`,L=S.tasks[k]||[],c=L.filter(t=>t.d).length,isT=D.y===T.y&&D.m===T.m&&D.d===T.d;tot+=L.length;dn+=c;const col=`s${i%5+1}`,bg=`w${i%5+1}`;
  cols+=`<div class="card" style="padding:0;overflow:hidden;margin:0${isT?';outline:2px solid var(--tx)':''}"><div style="background:var(--${bg});padding:8px 10px"><b>${WF[i]}</b><div class="sub">${fa(D.y)}/${fa(D.m)}/${fa(D.d)}</div></div><div style="text-align:center;padding:8px 0 0">${donut(L.length?c*100/L.length:0,`var(--${col})`,70)}</div><div style="padding:6px 10px 10px"><div class="ban" style="background:var(--${bg});font-size:12px;padding:3px">وظایف</div>${L.map((t,j)=>`<div class="task ${t.d?'d':''}"><span class="cb ${t.d?'on':''}" style="--s:var(--${col})" onclick="tt('${k}',${j})"></span><span class="grow">${t.t}</span><button class="x" onclick="dt('${k}',${j})">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><input class="grow" id="in${i}" placeholder="کار جدید..." onkeydown="if(event.key==='Enter')at('${k}',${i})"><button class="btn" onclick="at('${k}',${i})">+</button></div></div></div>`;
  bars+=`<div style="flex:1;text-align:center"><div style="height:110px;display:flex;align-items:flex-end;justify-content:center;gap:2px"><div style="width:42%;background:var(--${col});border-radius:6px 6px 0 0;height:${L.length?c*100/L.length:2}%;min-height:3px"></div><div style="width:42%;background:var(--${bg});border-radius:6px 6px 0 0;height:${L.length?(L.length-c)*100/L.length:0}%"></div></div><div class="sub">${WD[i]}</div></div>`}
 return `<div class="card row"><button class="btn ghost" onclick="wkOff--;render()">›</button><div class="grow" style="text-align:center"><b>هفته‌ای که از ${fa(st.d)} ${MN[st.m-1]} شروع می‌شود</b></div><button class="btn ghost" onclick="wkOff=0;render()">این هفته</button><button class="btn ghost" onclick="wkOff++;render()">‹</button></div>
 <div class="card row"><div class="ttl" style="min-width:170px">Weekly Planner</div><div style="flex:1;min-width:230px"><div class="ban">خلاصه پیشرفت</div><div style="display:flex;gap:4px">${bars}</div></div><div class="stat">${donut(tot?dn*100/tot:0,'var(--ok)',110)}<div class="sub">${fn(dn)} از ${fn(tot)} کار</div></div></div>
 <div class="g5" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cols}</div>`}
function at(k,i){const v=document.getElementById('in'+i).value.trim();if(!v)return;(S.tasks[k]=S.tasks[k]||[]).push({t:v.replace(/[<>&]/g,''),d:0});save();render()}
function tt(k,j){S.tasks[k][j].d^=1;save();render()}function dt(k,j){S.tasks[k].splice(j,1);save();render()}
// ============ BUDGET
const CATS=['خوراک','حمل‌ونقل','قبض','تفریح','خرید','سلامت','سایر'],CC=['#3b82f6','#22c55e','#ec4899','#f59e0b','#8b5cf6','#14b8a6','#94a3b8'];
function vBudget(){const{y,m}=cur,L=S.tx.map((t,i)=>({...t,i})).filter(t=>t.y===y&&t.m===m);
 const I=L.filter(t=>t.k==='i'),E=L.filter(t=>t.k==='e'),inc=I.reduce((a,t)=>a+t.a,0),ex=E.reduce((a,t)=>a+t.a,0),by=CATS.map(c=>E.filter(t=>t.c===c).reduce((a,t)=>a+t.a,0));
 const list=(A,cl)=>A.length?A.slice().reverse().map(t=>`<div class="tx" style="background:${cl}22"><div class="grow"><b>${t.n||t.c}</b><div class="sub">${t.c}</div></div><b>${fn(t.a)}</b><button class="x" onclick="dx(${t.i})">✕</button></div>`).join(''):'<div class="sub">خالی</div>';
 const bud=CATS.map((c,i)=>{const b=S.bud[c]||0,s=by[i];return `<div style="margin:8px 0"><div class="row"><span style="width:10px;height:10px;border-radius:3px;background:${CC[i]}"></span><span class="grow">${c}</span><input class="gi" style="width:90px" type="number" placeholder="بودجه" value="${b||''}" onchange="S.bud['${c}']=+this.value;save();render()"><span class="sub" style="width:80px;text-align:left">${fn(s)}</span></div><div class="bar"><i style="width:${b?Math.min(100,s*100/b):0}%;background:${b&&s>b?'var(--bad)':CC[i]}"></i></div>${b?`<div class="sub"${s>b?' style="color:var(--bad)"':''}>${s>b?'بیش از بودجه '+fn(s-b):'باقی‌مانده '+fn(b-s)}</div>`:''}</div>`}).join('');
 return mbar()+`<div class="card"><div class="top" style="grid-template-columns:230px 1fr 1fr"><div class="ttl">Budget Tracker</div><div class="stat">${donut(inc?(inc-ex)*100/inc:0,'var(--ok)',110)}<div class="sub">مانده از درآمد</div><b>${fn(inc-ex)}</b><div class="sub">تومان</div></div><div class="row" style="justify-content:center">${dm(by,CC,110)}<div class="sub">${CATS.map((c,i)=>`<div><span style="color:${CC[i]}">●</span> ${c}</div>`).join('')}</div></div></div></div>
 <div class="g5"><div class="card stat"><b class="inc" data-cu="${inc}">${fn(inc)}</b><span class="sub">درآمد</span></div><div class="card stat"><b class="exp" data-cu="${ex}">${fn(ex)}</b><span class="sub">هزینه</span></div><div class="card stat"><b>${inc?fa(Math.round(ex*100/inc)):'۰'}٪</b><span class="sub">نسبت هزینه به درآمد</span></div></div>
 <div class="card"><div class="row"><select id="bk"><option value="e">هزینه</option><option value="i">درآمد</option></select><select id="bc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input id="ba" type="number" inputmode="numeric" placeholder="مبلغ (تومان)" class="grow"><input id="bn" placeholder="توضیح" class="grow"><button class="btn" onclick="ax()">ثبت</button></div></div>
 <div class="g5" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><div class="ban" style="background:#22c55e33">درآمدها</div>${list(I,'#22c55e')}</div><div class="card"><div class="ban" style="background:#ef444433">هزینه‌ها</div>${list(E,'#ef4444')}</div><div class="card"><div class="ban">بودجه هر دسته</div>${bud}</div></div>`}
function ax(){const a=+document.getElementById('ba').value;if(!a)return;S.tx.push({y:cur.y,m:cur.m,k:bk.value,c:bc.value,a,n:bn.value.trim().replace(/[<>&]/g,'')});save();render()}
function dx(i){S.tx.splice(i,1);save();render()}
// ============ STUDY
function vStudy(){const{y,m}=cur,n=mLen(y,m),f=firstWd(y,m);
 const evs=d=>{const k=`${y}-${m}-${d}`;return[...(S.ev[k]||[]).map(e=>({...e})),...S.subj.filter(s=>s.y===y&&s.m===m&&s.d===d).map(s=>({t:'آزمون '+s.n,k:1}))]};
 let cells=WD.map((w,i)=>`<div class="h" style="background:var(--w${i%5+1})">${WF[i]}</div>`).join('')+'<div style="visibility:hidden"></div>'.repeat(f);
 for(let d=1;d<=n;d++){const E=evs(d),c=(f+d-1)%7,isT=y===T.y&&m===T.m&&d===T.d;cells+=`<div style="background:var(--w${c%5+1});cursor:pointer" class="${d===sel?'sel':''} ${isT?'today':''}" onclick="sel=${d};render()"><span class="dn">${fa(d)}</span>${E.slice(0,3).map(e=>`<div class="chip">${e.t}</div>`).join('')}${E.length>3?`<div class="sub">+${fn(E.length-3)}</div>`:''}</div>`}
 const k=`${y}-${m}-${sel}`,SE=S.ev[k]||[];
 const sj=S.subj.map((s,i)=>({...s,i,r:ser(s.y,s.m,s.d)-ser(T.y,T.m,T.d)})).sort((a,b)=>a.r-b.r);
 return mbar()+`<div class="card"><div class="ttl" style="margin-bottom:10px">Study Planner · ${MN[m-1]} ${fa(y)}</div><div class="cal">${cells}</div></div>
 <div class="g5" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><div class="ban">برنامه ${fa(sel)} ${MN[m-1]}</div>${SE.map((e,j)=>`<div class="task ${e.dn?'d':''}"><span class="cb ${e.dn?'on':''}" onclick="ev('${k}',${j},1)"></span><span class="grow">${e.t}</span><button class="x" onclick="ev('${k}',${j},0)">✕</button></div>`).join('')||'<div class="sub">برنامه‌ای نیست</div>'}<div class="row" style="margin-top:8px"><input class="grow" id="ei" placeholder="مثلاً: ریاضی ۲ ساعت" onkeydown="if(event.key==='Enter')eadd('${k}')"><button class="btn" onclick="eadd('${k}')">+</button></div></div>
 <div class="card"><div class="ban">درس‌ها و آزمون‌ها</div>${sj.map(s=>`<div class="tx" style="background:var(--w${s.i%5+1})"><div class="grow"><b>${s.n}</b><div class="sub">${fa(s.d)} ${MN[s.m-1]} ${fa(s.y)}</div></div><b>${s.r<0?'گذشته':s.r===0?'امروز!':fn(s.r)+' روز'}</b><button class="x" onclick="S.subj.splice(${s.i},1);save();render()">✕</button></div>`).join('')||'<div class="sub">هنوز درسی اضافه نشده</div>'}<div class="row" style="margin-top:8px"><input class="grow" id="sn" placeholder="نام درس"><select id="sm">${MN.map((x,i)=>`<option value="${i+1}" ${i+1==m?'selected':''}>${x}</option>`).join('')}</select><input id="sd" type="number" min="1" max="31" placeholder="روز" style="width:64px"><button class="btn" onclick="sadd()">+</button></div></div></div>`}
function eadd(k){const v=ei.value.trim();if(!v)return;(S.ev[k]=S.ev[k]||[]).push({t:v.replace(/[<>&]/g,'')});save();render()}
function ev(k,j,t){t?S.ev[k][j].dn^=1:S.ev[k].splice(j,1);save();render()}
function sadd(){const n=sn.value.trim(),d=+sd.value;if(!n||!d)return;S.subj.push({n:n.replace(/[<>&]/g,''),y:cur.y,m:+sm.value,d:Math.min(d,31)});save();render()}
function clr(i){if(!confirm('همهٔ خانه‌های این عادت در این ماه پاک شود؟'))return;delete S.ck[key(cur.y,cur.m,i)];save();render()}
function clrAll(){if(!confirm('همهٔ خانه‌های تیک‌خورده در این ماه پاک شود؟'))return;S.habits.forEach((h,i)=>delete S.ck[key(cur.y,cur.m,i)]);save();render()}
function navInd(){const b=document.querySelector('nav button.on'),n=document.getElementById('ni');if(!b||!n)return;n.style.width=b.offsetWidth+'px';n.style.transform='translateX('+b.offsetLeft+'px)'}
function cuNum(){document.querySelectorAll('[data-cu]').forEach(el=>{const v=+el.dataset.cu;if(!v)return;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1000),e=1-Math.pow(1-k,4);el.textContent=fn(Math.round(v*e));if(k<1)requestAnimationFrame(f)})(t0)})}
let _io=null;
function reveal(){if(!('IntersectionObserver' in window))return;_io=_io||new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;const t=x.target;_io.unobserve(t);t.classList.add('in');setTimeout(()=>t.classList.remove('rv','in'),900)}),{threshold:.06});[...document.getElementById('app').children].forEach(c=>{if(c.getBoundingClientRect().top>innerHeight*.9){c.style.animation='none';c.classList.add('rv');_io.observe(c)}})}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});
addEventListener('resize',navInd);addEventListener('load',navInd);
// ============ boot
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;fresh=true;scrollTo(0,0);render()});
const root=document.documentElement;try{const t=localStorage.getItem('pl_theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('theme').onclick=()=>{const dk=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dk?'light':'dark';try{localStorage.setItem('pl_theme',root.dataset.theme)}catch(e){}};
document.getElementById('out').onclick=()=>{if(confirm('از حساب خارج می‌شوی؟ اطلاعاتت ذخیره می‌ماند و با همان نام دوباره وارد می‌شوی.')){try{localStorage.removeItem('planner_last')}catch(e){}load('guest');S.user=null;tab='habit';showLogin();render()}};
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,e.closest('nav')?22:18));
showLogin();render();
</script>
</body>
